services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "5174:5174"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    stdin_open: true
    tty: true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    stdin_open: true
    tty: true

  database:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: